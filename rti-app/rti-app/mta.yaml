_schema-version: 3.3.0
ID: rti-tracking
version: 1.0.0
description: "Reusable Transport Items (RTI) tracking - SAP CAP + SAPUI5"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: rti-tracking-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: rti-tracking-auth
      - name: rti-tracking-db
      - name: rti-tracking-destination   # S/4HANA integration adapter resolves destination "S4HANA"
      - name: rti-tracking-jobscheduler  # daily aging/demurrage job (runScheduledAgingJob)

  - name: rti-tracking-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: rti-tracking-db
  - name: rti-tracking
    type: approuter.nodejs
    path: app/router
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources && mkdir -p resources && cp -r ../rti/webapp/. resources/
      build-result: .
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: rti-tracking-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: rti-tracking-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: rti-tracking-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'WarehouseOperator (rti-tracking ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.WarehouseOperator'
          - name: 'LogisticsHead (rti-tracking ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.LogisticsHead'
          - name: 'Admin (rti-tracking ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Admin'
          - name: 'LogisticsManager (rti-tracking ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.LogisticsManager'
          - name: 'InventoryPlanner (rti-tracking ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.InventoryPlanner'
    requires:
      - name: app-api
  - name: rti-tracking-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: rti-tracking-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: S4HANA
                Description: S/4HANA OData APIs (outbound delivery, purchase requisition, debit memo)
                Type: HTTP
                URL: https://your-s4-system.example.com:443
                Authentication: OAuth2ClientCredentials
                ProxyType: Internet
                sap-client: '100'
              # IMPORTANT: replace URL/credentials with your real S/4 system. The OAuth2 client
              # id/secret are set as destination-sensitive properties in the BTP cockpit.
  - name: rti-tracking-jobscheduler
    type: org.cloudfoundry.managed-service
    parameters:
      service: jobscheduler
      service-plan: standard

