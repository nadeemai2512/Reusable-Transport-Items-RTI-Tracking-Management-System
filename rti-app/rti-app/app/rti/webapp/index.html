<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTI Tracking &amp; Management</title>
  <!-- SAPUI5 (not OpenUI5) is required for sap.viz charts and sap.ndc barcode scanning.

       CDN note: the SAP UI5 CDN exposes version BRANCHES (e.g. "1.120") that resolve to the
       latest patch of that branch, but NOT exact patch versions like "1.120.0" — those URLs
       return HTTP 404 and UI5 silently fails to load. Always use a branch ("1.120") or the
       unversioned path ("https://ui5.sap.com/resources/...") for the latest.

       To point the app at a locally hosted UI5 distribution, append ?ui5=<base-url> to the
       page URL, e.g. http://localhost:4004/rti/webapp/index.html?ui5=http://localhost:4004/ui5
  -->
  <script>
    (function () {
      var base = "https://ui5.sap.com/1.120";
      var m = location.search.match(/[?&]ui5=([^&]+)/);
      if (m) { base = decodeURIComponent(m[1]); }
      var s = document.createElement("script");
      s.id = "sap-ui-bootstrap";
      s.src = base + "/resources/sap-ui-core.js";
      s.setAttribute("data-sap-ui-theme", "sap_horizon");
      s.setAttribute("data-sap-ui-resourceroots", '{"rti.app": "./"}');
      s.setAttribute("data-sap-ui-oninit", "module:sap/ui/core/ComponentSupport");
      s.setAttribute("data-sap-ui-compatVersion", "edge");
      s.setAttribute("data-sap-ui-async", "true");
      // If the loader itself fails to load (network/CDN blocked), show a clear message.
      s.onerror = function () {
        // Try the unversioned latest CDN as a last resort before giving up.
        var s2 = document.createElement("script");
        s2.src = "https://ui5.sap.com/resources/sap-ui-core.js";
        s2.setAttribute("data-sap-ui-theme", "sap_horizon");
        s2.setAttribute("data-sap-ui-resourceroots", '{"rti.app": "./"}');
        s2.setAttribute("data-sap-ui-oninit", "module:sap/ui/core/ComponentSupport");
        s2.setAttribute("data-sap-ui-compatVersion", "edge");
        s2.setAttribute("data-sap-ui-async", "true");
        s2.onerror = function () {
          var el = document.getElementById("rtiBootErr");
          if (el) { el.style.display = "block"; }
        };
        document.head.appendChild(s2);
      };
      document.head.appendChild(s);

      // Safety net: if UI5 still hasn't initialised after 15s, show the error panel.
      setTimeout(function () {
        if (typeof sap === "undefined" || !sap.ui) {
          var el = document.getElementById("rtiBootErr");
          if (el) { el.style.display = "block"; }
        }
      }, 15000);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="sapUiBody" id="content">
  <div id="rtiBootErr" style="display:none; padding:2rem; font-family:Arial,sans-serif;">
    <h2>Unable to load SAPUI5</h2>
    <p>The SAPUI5 runtime could not be loaded from the configured CDN. Please check your network
    connection, or open this page with <code>?ui5=&lt;your-ui5-base-url&gt;</code> to point at a
    locally hosted UI5 distribution (e.g. <code>?ui5=http://localhost:4004/ui5</code>).</p>
  </div>
  <div data-sap-ui-component data-name="rti.app" data-id="container" data-settings='{"id": "rti"}' data-handle-validation="true"></div>
</body>
</html>
