<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTI Tracking &amp; Management</title>
  <!-- SAPUI5 (not OpenUI5) is required for sap.viz charts and sap.ndc barcode scanning.
       Change the version here if your landscape uses a different one. -->
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{"rti.app": "./"}'
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="sapUiBody" id="content">
  <div data-sap-ui-component data-name="rti.app" data-id="container" data-settings='{"id": "rti"}' data-handle-validation="true"></div>
</body>
</html>
